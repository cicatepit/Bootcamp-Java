<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap: requerido por evaluación; aporta responsividad y componentes base. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome: iconografía liviana para mejorar UX. -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>WOOLET | Login</title>
</head>
<body data-page="login">
    <div class="app-layout login-layout">
        <main class="woolet-container sidebar login-sidebar">
            <section class="logo-box"><img src="assets/woolet-logo.png" alt="WOOLET Logo" class="logo-image"></section>
            <section class="auth-box" id="authBox">
                <!-- Inputs de autenticación: luego pueden conectarse a Spring Security. -->
                <input type="text" class="terminal-input" id="username" placeholder="user" aria-label="Usuario">
                <input type="password" class="terminal-input" id="password" placeholder="password" aria-label="Clave">
                <button class="access-button" id="accessButton" type="button"><i class="fa-solid fa-right-to-bracket"></i> ACCESS</button>
                <p class="login-error" id="loginError"></p>
                <small class="terminal-hint">Demo: user / pass</small>
            </section>
        </main>
        <section class="content-panel login-panel active">
            <h1>WOOLET</h1>
            <p>Autentícate para iniciar la sesión de billetera digital.</p>
            <p class="terminal-hint">Frontend modular preparado para escalar hacia Spring MVC / Thymeleaf.</p>
        </section>
    </div>
    <div id="footerComponent"></div>
    <!-- jQuery: requerido por evaluación; usado para eventos, DOM y fadeIn/fadeOut. -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
