<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap: requerido por evaluación; aporta responsividad y componentes base. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome: iconografía liviana para mejorar UX. -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>WOOLET | Destinatarios</title>
</head>
<body data-page="destinatarios">
    <!-- Shell de componentes: sidebar + contenido + detalle. -->
    <div class="app-layout">
        <div id="sidebarComponent" data-active="destinatarios"></div>
        <main class="content-panel main-content active" id="contentPanel">
            <div class="panel-title-row">
                <h2>DESTINATARIOS</h2>
                <button type="button" class="access-button compact-button" id="showAddRecipientButton"><i class="fa-solid fa-user-plus"></i> AGREGAR DESTINATARIO</button>
            </div>
            <input type="text" class="terminal-input" id="recipientSearch" placeholder="Buscar destinatario">
            <div class="recipient-list" id="recipientList"></div>
        </main>
        <aside class="detail-panel " id="detailPanel">

        </aside>
    </div>
    <div id="footerComponent"></div>
    <!-- jQuery: requerido por evaluación; usado para eventos, DOM y fadeIn/fadeOut. -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
