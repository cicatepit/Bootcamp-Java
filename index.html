<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración básica del documento HTML -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título visible en la pestaña del navegador -->
    <title>M2.WOOLET</title>

    <!-- Conexión con la hoja de estilos externa -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor general de la interfaz -->
    <main class="woolet-container">

        <!-- Caja superior destinada al logo de la wallet -->
        <section class="logo-box">
            <!-- Placeholder: aquí más adelante irá la imagen del logo -->
            <div class="logo-placeholder">
                [ WOOLET LOGO ]
            </div>
        </section>

        <!-- Caja inferior para autenticación de usuario -->
        <section class="auth-box">

            <!-- Campo para ingresar el usuario -->
            <input 
                type="text" 
                class="terminal-input" 
                value="user"
                aria-label="Usuario"
            >

            <!-- Campo para ingresar la clave -->
            <input 
                type="password" 
                class="terminal-input" 
                value="key"
                aria-label="Clave"
            >

            <!-- Botón de acceso inicial -->
            <button class="access-button">
                ACCESS
            </button>

        </section>

    </main>

</body>
</html>
