<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap: requerido por evaluación; aporta responsividad y componentes base. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome: iconografía liviana para mejorar UX. -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>WOOLET | Transferir</title>
</head>
<body data-page="transferir">
    <!-- Shell de componentes: sidebar + contenido + detalle. -->
    <div class="app-layout">
        <div id="sidebarComponent" data-active="transferir"></div>
        <main class="content-panel main-content active" id="contentPanel">
            <h2>TRANSFERIR</h2>
            <form class="transfer-form" id="transferForm" novalidate>
                <label for="destinatario">Cuenta destino</label>
                <input type="text" id="destinatario" class="terminal-input" placeholder="Alias o número de cuenta" required>
                <label for="monto">Monto CLP</label>
                <input type="number" id="monto" class="terminal-input" placeholder="$" min="1" required>
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" class="terminal-textarea" placeholder="Comentario opcional"></textarea>
                <button type="button" class="access-button" id="previewTransferButton"><i class="fa-solid fa-paper-plane"></i> TRANSFERIR</button>
            </form>
        </main>
        <aside class="detail-panel " id="detailPanel">

        </aside>
    </div>
    <div id="footerComponent"></div>
    <!-- jQuery: requerido por evaluación; usado para eventos, DOM y fadeIn/fadeOut. -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
